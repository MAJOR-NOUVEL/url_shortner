name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortener_user
          POSTGRES_PASSWORD: shortener_pass
          POSTGRES_DB: shortener_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check backend

      - name: Run Test Suite with Pytest & Coverage
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://shortener_user:shortener_pass@localhost:5432/shortener_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-minimum-32-bytes-long!
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-bytes-long!
        run: |
          python -m pytest backend/tests --cov=backend/app --cov-report=term-missing
