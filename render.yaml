services:
  - type: web
    name: bitroot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: DATABASE_URL
        fromDatabase:
          name: bitroot-db
          property: connectionString

databases:
  - name: bitroot-db
    plan: free
