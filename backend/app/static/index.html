<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitRoot — Fast URL Shortener</title>
  
  <link rel="icon" type="image/png" href="/static/logo-bitroot.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/logo-bitroot.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"Consolas"', 'monospace'],
          },
          colors: {
            kraft: {
              50: '#fdfbf7',
              100: '#f6f1e5',
              150: '#eee5d3',
              200: '#e5d9bf',
              300: '#d5c5a4',
              400: '#ba9f73',
              500: '#9b7f52',
              600: '#7b633d',
              700: '#5a4729',
              800: '#3d301b',
              900: '#251c10',
              border: '#d6c8b0',
              borderDark: '#bfae91',
            },
            amberAccent: {
              400: '#f3b438',
              500: '#e59a18',
              600: '#d0860c',
              700: '#b06d04',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, Babel, and QR Code Generator -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #f1ebd9;
      color: #2b2214;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    input:focus, select:focus {
      outline: none;
      border-color: #d0860c;
      box-shadow: 0 0 0 2px rgba(229, 154, 24, 0.25);
    }
    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tactile-btn {
      box-shadow: 0 1px 2px rgba(45, 30, 10, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .tactile-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 2px rgba(45, 30, 10, 0.2);
    }
    .cardboard-shadow {
      box-shadow: 0 4px 16px -2px rgba(60, 45, 20, 0.08), 0 2px 6px -1px rgba(60, 45, 20, 0.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-amber-300/40 selection:text-amber-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = "";
    const getAuthToken = () => localStorage.getItem("bitroot_token") || localStorage.getItem("snipurl_token");
    const setAuthToken = (token) => {
      localStorage.setItem("bitroot_token", token);
      localStorage.setItem("snipurl_token", token);
    };
    const removeAuthToken = () => {
      localStorage.removeItem("bitroot_token");
      localStorage.removeItem("snipurl_token");
    };

    const apiRequest = async (url, options = {}) => {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const token = getAuthToken();
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch(`${API_BASE}${url}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const errorMsg = data.message || data.error || (data.details ? data.details.map(d => d.message).join(", ") : "Request failed");
        throw new Error(errorMsg);
      }
      return data;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [urls, setUrls] = useState([]);
      const [url, setUrl] = useState('');
      const [customAlias, setCustomAlias] = useState('');
      const [expiresIn, setExpiresIn] = useState('');
      const [showOptions, setShowOptions] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [lastCreated, setLastCreated] = useState(null);
      const [copied, setCopied] = useState(false);
      const [selectedAnalyticsId, setSelectedAnalyticsId] = useState(null);
      const [analyticsData, setAnalyticsData] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authIsRegister, setAuthIsRegister] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [qrModalUrl, setQrModalUrl] = useState(null);

      const qrRef = useRef(null);

      useEffect(() => {
        if (getAuthToken()) {
          apiRequest("/api/auth/me")
            .then(res => setUser(res.user))
            .catch(() => removeAuthToken());
        }
      }, []);

      const fetchUrls = () => {
        if (user) {
          apiRequest("/api/urls")
            .then(res => setUrls(res))
            .catch(() => {});
        } else {
          setUrls([]);
        }
      };

      useEffect(() => { fetchUrls(); }, [user]);

      const handleShorten = async (e) => {
        e.preventDefault();
        if (!url.trim()) return;
        setLoading(true);
        setError('');
        try {
          const res = await apiRequest("/api/urls", {
            method: "POST",
            body: JSON.stringify({
              url,
              custom_alias: customAlias || null,
              expires_in_hours: expiresIn ? parseInt(expiresIn) : null
            })
          });
          setLastCreated(res);
          setUrl('');
          setCustomAlias('');
          setExpiresIn('');
          setShowOptions(false);
          fetchUrls();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleCopy = async (textToCopy) => {
        const target = textToCopy || lastCreated?.short_url;
        if (!target) return;
        try {
          await navigator.clipboard.writeText(target);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {}
      };

      const openAnalytics = async (id) => {
        setSelectedAnalyticsId(id);
        setAnalyticsData(null);
        try {
          const data = await apiRequest(`/api/urls/${id}/analytics`);
          setAnalyticsData(data);
        } catch (err) {
          alert("Error loading statistics: " + err.message);
        }
      };

      const handleDeleteUrl = async (id) => {
        if (confirm("Delete this link? It will stop redirecting immediately.")) {
          await apiRequest(`/api/urls/${id}`, { method: "DELETE" });
          fetchUrls();
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        try {
          if (authIsRegister) {
            await apiRequest("/api/auth/register", { method: "POST", body: JSON.stringify({ email: authEmail, password: authPassword }) });
          }
          const loginRes = await apiRequest("/api/auth/login", { method: "POST", body: JSON.stringify({ email: authEmail, password: authPassword }) });
          setAuthToken(loginRes.access_token);
          setUser(loginRes.user);
          setIsAuthOpen(false);
          setAuthEmail('');
          setAuthPassword('');
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const openQrCode = (linkUrl) => {
        setQrModalUrl(linkUrl);
        setTimeout(() => {
          if (qrRef.current && window.QRCode) {
            qrRef.current.innerHTML = "";
            new QRCode(qrRef.current, {
              text: linkUrl,
              width: 180,
              height: 180,
              colorDark: "#2b2214",
              colorLight: "#faf7f0",
              correctLevel: QRCode.CorrectLevel.H
            });
          }
        }, 50);
      };

      const downloadQrImage = () => {
        if (!qrRef.current) return;
        const img = qrRef.current.querySelector("img") || qrRef.current.querySelector("canvas");
        if (!img) return;
        const a = document.createElement("a");
        a.download = `bitroot-${Date.now()}.png`;
        a.href = img.src || (img.toDataURL ? img.toDataURL("image/png") : "");
        a.click();
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Clean Navbar */}
          <header className="border-b border-kraft-border bg-kraft-100/95 backdrop-blur-sm sticky top-0 z-30 shadow-xs">
            <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              {/* BitRoot Logo */}
              <a href="/" className="flex items-center gap-2.5 text-kraft-900 hover:opacity-90 transition-opacity">
                <img 
                  src="/static/logo-bitroot.png" 
                  alt="BitRoot logo" 
                  className="w-8 h-8 sm:w-9 sm:h-9 object-contain drop-shadow-xs" 
                />
                <span className="font-bold text-lg tracking-tight text-kraft-900">
                  Bit<span className="text-amberAccent-700">Root</span>
                </span>
              </a>

              {/* User Navigation Controls */}
              <div className="flex items-center gap-3">
                {user ? (
                  <div className="flex items-center gap-3">
                    <span className="hidden sm:inline font-mono text-xs text-kraft-700 bg-kraft-150 px-2.5 py-1 rounded-md border border-kraft-border">
                      {user.email}
                    </span>
                    <button
                      onClick={() => { removeAuthToken(); setUser(null); }}
                      className="px-3 py-1.5 rounded-lg bg-kraft-150 hover:bg-kraft-200 border border-kraft-border text-kraft-800 text-xs tactile-btn transition-colors"
                    >
                      Sign out
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setIsAuthOpen(true)}
                    className="px-4 py-1.5 rounded-lg bg-gradient-to-b from-amberAccent-400 to-amberAccent-600 hover:from-amberAccent-500 hover:to-amberAccent-700 text-kraft-950 font-semibold text-xs border border-amberAccent-700/60 tactile-btn transition-colors shadow-sm"
                  >
                    Sign in
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Middle Section with User-Uploaded Illustration as Background */}
          <div 
            className="flex-1 w-full bg-cover bg-center bg-no-repeat relative flex flex-col justify-start"
            style={{ 
              backgroundImage: "url('/static/bg-bitroot.png')"
            }}
          >
            {/* Subtle warm tint overlay so artwork shines while keeping cards distinct */}
            <div className="absolute inset-0 bg-[#f1ebd9]/30 pointer-events-none"></div>

            <main className="flex-1 max-w-3xl mx-auto w-full px-4 py-10 space-y-8 relative z-10">
              
              {/* Hero Heading on Translucent Cardboard Plate */}
              <div className="text-center space-y-2 bg-kraft-50/90 backdrop-blur-sm border border-kraft-border/80 rounded-2xl py-6 px-6 max-w-lg mx-auto cardboard-shadow">
                <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-kraft-900">
                  Smart links, simplified.
                </h1>
                <p className="text-kraft-700 text-sm sm:text-base">
                  Transform long, cluttered URLs into clean, fast links with real-time analytics.
                </p>
              </div>

              {/* Shortener Box (Cardboard Panel) */}
              <div className="bg-kraft-50/95 backdrop-blur-md border border-kraft-border rounded-2xl p-5 sm:p-7 cardboard-shadow space-y-4">
                <form onSubmit={handleShorten} className="space-y-4">
                  <div className="flex flex-col sm:flex-row gap-2.5">
                    <div className="relative flex-1">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-kraft-400">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                        </svg>
                      </div>
                      <input
                        type="url"
                        required
                        value={url}
                        onChange={(e) => setUrl(e.target.value)}
                        placeholder="Paste your link here (https://...)"
                        className="w-full pl-10 pr-4 py-3 bg-kraft-100/70 border border-kraft-border rounded-xl text-kraft-900 placeholder-kraft-400 text-sm font-mono shadow-inner transition-colors"
                      />
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => setShowOptions(!showOptions)}
                        className={`px-3 py-3 rounded-xl border text-xs font-medium transition-colors flex items-center gap-1.5 tactile-btn ${
                          showOptions 
                            ? 'bg-kraft-200 border-kraft-borderDark text-kraft-900 font-semibold' 
                            : 'bg-kraft-100 hover:bg-kraft-150 border-kraft-border text-kraft-700'
                        }`}
                      >
                        <svg className="w-3.5 h-3.5 text-kraft-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                        <span>Options</span>
                      </button>

                      <button
                        type="submit"
                        disabled={loading}
                        className="px-6 py-3 bg-gradient-to-b from-amberAccent-400 to-amberAccent-600 hover:from-amberAccent-500 hover:to-amberAccent-700 text-kraft-950 font-semibold text-sm rounded-xl border border-amberAccent-700/60 tactile-btn transition-all disabled:opacity-50 whitespace-nowrap shadow-sm"
                      >
                        {loading ? 'Shortening...' : 'Shorten URL'}
                      </button>
                    </div>
                  </div>

                  {/* Collapsible Options */}
                  {showOptions && (
                    <div className="pt-3 border-t border-kraft-border grid grid-cols-1 sm:grid-cols-2 gap-4 fade-in bg-kraft-100/60 p-3.5 rounded-xl border border-kraft-border/60">
                      <div>
                        <label className="block text-xs font-medium text-kraft-800 mb-1">Custom alias (optional)</label>
                        <div className="relative flex items-center">
                          <span className="absolute left-3 text-xs font-mono text-kraft-500">/</span>
                          <input
                            type="text"
                            value={customAlias}
                            onChange={(e) => setCustomAlias(e.target.value)}
                            placeholder="custom-slug"
                            maxLength={32}
                            className="w-full pl-7 pr-3 py-2 bg-kraft-50 border border-kraft-border rounded-lg text-kraft-900 text-xs font-mono"
                          />
                        </div>
                        <p className="text-[11px] text-kraft-500 mt-1">Letters, numbers, and hyphens.</p>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-kraft-800 mb-1">Link expiration</label>
                        <select
                          value={expiresIn}
                          onChange={(e) => setExpiresIn(e.target.value)}
                          className="w-full px-3 py-2 bg-kraft-50 border border-kraft-border rounded-lg text-kraft-800 text-xs"
                        >
                          <option value="">Never (Permanent)</option>
                          <option value="1">1 Hour</option>
                          <option value="24">24 Hours</option>
                          <option value="168">7 Days</option>
                          <option value="720">30 Days</option>
                        </select>
                        <p className="text-[11px] text-kraft-500 mt-1">Link will stop redirecting after expiration.</p>
                      </div>
                    </div>
                  )}

                  {error && (
                    <div className="p-3 bg-red-100 border border-red-300 text-red-900 text-xs rounded-xl flex items-center gap-2">
                      <svg className="w-4 h-4 flex-shrink-0 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                      </svg>
                      <span>{error}</span>
                    </div>
                  )}
                </form>

                {/* Result Card */}
                {lastCreated && (
                  <div className="bg-kraft-150/90 border border-kraft-borderDark rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 fade-in">
                    <div className="space-y-1 min-w-0 flex-1">
                      <div className="flex items-center gap-1.5">
                        <svg className="w-4 h-4 text-emerald-700" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span className="text-[11px] font-semibold text-emerald-800">
                          Link ready to share
                        </span>
                      </div>
                      <div className="text-lg font-bold font-mono text-kraft-900 truncate">
                        <a href={lastCreated.short_url} target="_blank" rel="noreferrer" className="text-amberAccent-700 hover:underline">
                          {lastCreated.short_url}
                        </a>
                      </div>
                      <p className="text-xs text-kraft-600 truncate max-w-md font-mono">
                        {lastCreated.original_url}
                      </p>
                    </div>

                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button
                        onClick={() => handleCopy()}
                        className="px-3.5 py-2 bg-gradient-to-b from-amberAccent-400 to-amberAccent-600 hover:from-amberAccent-500 hover:to-amberAccent-700 text-kraft-950 font-semibold text-xs rounded-lg border border-amberAccent-700/60 tactile-btn transition-colors flex items-center gap-1.5 shadow-sm"
                      >
                        {copied ? (
                          <>
                            <svg className="w-3.5 h-3.5 text-kraft-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>Copied!</span>
                          </>
                        ) : (
                          <>
                            <svg className="w-3.5 h-3.5 text-kraft-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            <span>Copy link</span>
                          </>
                        )}
                      </button>

                      <button
                        onClick={() => openQrCode(lastCreated.short_url)}
                        className="p-2 bg-kraft-100 hover:bg-kraft-200 border border-kraft-border text-kraft-700 rounded-lg tactile-btn text-xs transition-colors"
                        title="QR Code"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                        </svg>
                      </button>

                      <a
                        href={lastCreated.short_url}
                        target="_blank"
                        rel="noreferrer"
                        className="p-2 bg-kraft-100 hover:bg-kraft-200 border border-kraft-border text-kraft-700 rounded-lg tactile-btn text-xs transition-colors"
                        title="Open destination"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                      </a>
                    </div>
                  </div>
                )}
              </div>

              {/* Saved Links Section */}
              {user ? (
                <div className="space-y-3">
                  <div className="flex items-center justify-between px-1">
                    <h3 className="text-sm font-bold text-kraft-900 bg-kraft-50/80 backdrop-blur-xs px-3 py-1 rounded-lg border border-kraft-border/60 inline-block">
                      Your Links ({urls.length})
                    </h3>
                  </div>

                  <div className="bg-kraft-50/95 backdrop-blur-md border border-kraft-border rounded-2xl overflow-hidden cardboard-shadow">
                    {urls.length === 0 ? (
                      <div className="p-8 text-center text-kraft-500 text-xs">
                        You haven't created any links yet. Paste a URL above to start.
                      </div>
                    ) : (
                      <div className="divide-y divide-kraft-border">
                        {urls.map(item => (
                          <div key={item.id} className="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-kraft-100/60 transition-colors">
                            <div className="space-y-1 min-w-0 flex-1">
                              <div className="flex items-center gap-2">
                                <a href={item.short_url} target="_blank" rel="noreferrer" className="font-mono font-semibold text-amberAccent-700 hover:underline text-sm">
                                  /{item.short_code}
                                </a>
                                <span className="text-[11px] font-mono px-2 py-0.5 rounded-full bg-kraft-150 border border-kraft-border text-kraft-700">
                                  {item.click_count} {item.click_count === 1 ? 'click' : 'clicks'}
                                </span>
                                {item.is_expired && (
                                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-red-100 text-red-800 border border-red-200">
                                    Expired
                                  </span>
                                )}
                              </div>
                              <p className="text-xs text-kraft-600 truncate max-w-md font-mono">{item.original_url}</p>
                            </div>

                            <div className="flex items-center gap-2 self-end sm:self-center">
                              <button
                                onClick={() => openQrCode(item.short_url)}
                                className="p-2 rounded-lg bg-kraft-100 hover:bg-kraft-150 border border-kraft-border text-kraft-700 text-xs tactile-btn transition-colors"
                                title="QR Code"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                                </svg>
                              </button>

                              <button
                                onClick={() => openAnalytics(item.id)}
                                className="px-3 py-1.5 rounded-lg bg-kraft-100 hover:bg-kraft-150 border border-kraft-border text-xs text-kraft-800 flex items-center gap-1.5 tactile-btn transition-colors"
                              >
                                <svg className="w-3.5 h-3.5 text-amberAccent-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                </svg>
                                <span>Analytics</span>
                              </button>

                              <button
                                onClick={() => handleDeleteUrl(item.id)}
                                className="p-2 rounded-lg bg-kraft-100 hover:bg-red-100 border border-kraft-border hover:border-red-300 text-kraft-600 hover:text-red-700 text-xs tactile-btn transition-colors"
                                title="Delete link"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ) : (
                <div className="p-6 bg-kraft-50/95 backdrop-blur-md border border-kraft-border rounded-2xl text-center space-y-2 cardboard-shadow">
                  <p className="text-xs text-kraft-700">
                    Want to track click analytics and manage your links?{' '}
                    <button onClick={() => setIsAuthOpen(true)} className="text-amberAccent-700 hover:underline font-semibold">
                      Sign in or create an account
                    </button>
                  </p>
                </div>
              )}
            </main>
          </div>

          {/* Footer - With Prominent Tech Stack */}
          <footer className="border-t border-kraft-border bg-kraft-100/95 backdrop-blur-sm py-6 text-xs text-kraft-700 relative z-20">
            <div className="max-w-4xl mx-auto px-4 space-y-4">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 text-kraft-800">
                <div className="flex items-center gap-2">
                  <img 
                    src="/static/logo-bitroot.png" 
                    alt="BitRoot logo" 
                    className="w-5 h-5 object-contain" 
                  />
                  <span className="font-bold text-sm tracking-tight text-kraft-900">BitRoot</span>
                  <span className="text-kraft-400">|</span>
                  <span className="text-xs text-kraft-600">Fast, privacy-friendly URL shortener</span>
                </div>
                <div className="flex items-center gap-3 text-xs text-kraft-600">
                  <a href="/health" target="_blank" className="hover:text-kraft-900 underline transition-colors">System Diagnostics</a>
                  <span>&bull;</span>
                  <span>Active</span>
                </div>
              </div>

              {/* Explicit Tech Stack Mention */}
              <div className="pt-3 border-t border-kraft-border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-[11px]">
                <span className="font-bold text-kraft-900 uppercase tracking-wider text-[10px]">Tech Stack:</span>
                <div className="flex flex-wrap items-center gap-1.5 font-mono text-[11px]">
                  <span className="px-2 py-0.5 rounded bg-kraft-50 border border-kraft-border text-kraft-800">Python 3.12 (Flask)</span>
                  <span className="px-2 py-0.5 rounded bg-kraft-50 border border-kraft-border text-kraft-800">PostgreSQL + SQLAlchemy</span>
                  <span className="px-2 py-0.5 rounded bg-kraft-50 border border-kraft-border text-kraft-800">Redis 7 (Cache & Limiter)</span>
                  <span className="px-2 py-0.5 rounded bg-kraft-50 border border-kraft-border text-kraft-800">Celery Async Worker</span>
                  <span className="px-2 py-0.5 rounded bg-kraft-50 border border-kraft-border text-kraft-800">React 18 + Tailwind</span>
                </div>
              </div>
            </div>
          </footer>

          {/* QR Code Modal */}
          {qrModalUrl && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-kraft-900/40 backdrop-blur-xs fade-in">
              <div className="bg-kraft-50 border border-kraft-borderDark rounded-2xl p-6 max-w-xs w-full cardboard-shadow space-y-4 text-center">
                <div className="flex items-center justify-between border-b border-kraft-border pb-2.5 text-xs font-semibold text-kraft-900">
                  <span>QR Code</span>
                  <button onClick={() => setQrModalUrl(null)} className="text-kraft-500 hover:text-kraft-900">✕</button>
                </div>
                <div ref={qrRef} className="p-3 bg-white rounded-xl border border-kraft-border mx-auto flex items-center justify-center w-[204px] h-[204px]"></div>
                <p className="text-xs font-mono text-kraft-700 truncate">{qrModalUrl}</p>
                <button
                  onClick={downloadQrImage}
                  className="w-full py-2 bg-gradient-to-b from-amberAccent-400 to-amberAccent-600 hover:from-amberAccent-500 hover:to-amberAccent-700 text-kraft-950 font-semibold text-xs rounded-xl border border-amberAccent-700/60 tactile-btn transition-colors"
                >
                  Download PNG
                </button>
              </div>
            </div>
          )}

          {/* Analytics Modal */}
          {selectedAnalyticsId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-kraft-900/40 backdrop-blur-xs fade-in">
              <div className="bg-kraft-50 border border-kraft-borderDark rounded-2xl p-6 max-w-xl w-full cardboard-shadow space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-kraft-border pb-3">
                  <div>
                    <span className="text-[10px] font-mono uppercase tracking-wider text-amberAccent-700 font-bold">Link Performance</span>
                    <h3 className="text-base font-bold text-kraft-900 font-mono">{analyticsData ? `/${analyticsData.short_code}` : 'Loading...'}</h3>
                  </div>
                  <button onClick={() => setSelectedAnalyticsId(null)} className="text-kraft-500 hover:text-kraft-900 text-sm">✕</button>
                </div>

                {!analyticsData ? (
                  <div className="p-8 text-center text-kraft-500 text-xs font-mono">Loading statistics...</div>
                ) : (
                  <div className="space-y-5">
                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-kraft-100 p-4 rounded-xl border border-kraft-border">
                        <span className="text-[10px] uppercase tracking-wider text-kraft-600 font-semibold">Total Clicks</span>
                        <div className="text-2xl font-bold text-kraft-900 font-mono mt-0.5">{analyticsData.total_clicks}</div>
                      </div>
                      <div className="bg-kraft-100 p-4 rounded-xl border border-kraft-border">
                        <span className="text-[10px] uppercase tracking-wider text-kraft-600 font-semibold">Unique Visitors</span>
                        <div className="text-2xl font-bold text-amberAccent-700 font-mono mt-0.5">{analyticsData.unique_visitors}</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="bg-kraft-100 p-4 rounded-xl border border-kraft-border space-y-2.5">
                        <h4 className="text-xs font-bold text-kraft-800">Top Referrers</h4>
                        <div className="space-y-2">
                          {analyticsData.top_referrers.length === 0 ? <p className="text-xs text-kraft-500">No clicks recorded</p> :
                            analyticsData.top_referrers.map((r, i) => (
                              <div key={i} className="space-y-1">
                                <div className="flex justify-between text-xs">
                                  <span className="text-kraft-800">{r.name}</span>
                                  <span className="text-kraft-600 font-mono">{r.count} ({r.percentage}%)</span>
                                </div>
                                <div className="w-full bg-kraft-200 h-1.5 rounded-full overflow-hidden">
                                  <div className="bg-amberAccent-500 h-full rounded-full" style={{ width: `${r.percentage}%` }}></div>
                                </div>
                              </div>
                            ))
                          }
                        </div>
                      </div>

                      <div className="bg-kraft-100 p-4 rounded-xl border border-kraft-border space-y-2.5">
                        <h4 className="text-xs font-bold text-kraft-800">Devices</h4>
                        <div className="space-y-2">
                          {analyticsData.devices.length === 0 ? <p className="text-xs text-kraft-500">No clicks recorded</p> :
                            analyticsData.devices.map((d, i) => (
                              <div key={i} className="space-y-1">
                                <div className="flex justify-between text-xs">
                                  <span className="text-kraft-800">{d.name}</span>
                                  <span className="text-kraft-600 font-mono">{d.count} ({d.percentage}%)</span>
                                </div>
                                <div className="w-full bg-kraft-200 h-1.5 rounded-full overflow-hidden">
                                  <div className="bg-amberAccent-600 h-full rounded-full" style={{ width: `${d.percentage}%` }}></div>
                                </div>
                              </div>
                            ))
                          }
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Auth Modal */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-kraft-900/40 backdrop-blur-xs fade-in">
              <div className="bg-kraft-50 border border-kraft-borderDark rounded-2xl p-6 max-w-sm w-full cardboard-shadow space-y-4">
                <div className="flex items-center justify-between border-b border-kraft-border pb-2.5">
                  <h3 className="text-xs font-bold text-kraft-900 uppercase tracking-wide">
                    {authIsRegister ? 'Create BitRoot Account' : 'Sign in to BitRoot'}
                  </h3>
                  <button onClick={() => setIsAuthOpen(false)} className="text-kraft-500 hover:text-kraft-900 text-xs">✕</button>
                </div>
                <form onSubmit={handleAuth} className="space-y-3">
                  <div>
                    <label className="block text-xs font-medium text-kraft-800 mb-1">Email</label>
                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      placeholder="you@domain.com"
                      className="w-full px-3 py-2 bg-kraft-100/60 border border-kraft-border rounded-lg text-kraft-900 text-xs font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-kraft-800 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      minLength={8}
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      placeholder="At least 8 characters"
                      className="w-full px-3 py-2 bg-kraft-100/60 border border-kraft-border rounded-lg text-kraft-900 text-xs font-mono"
                    />
                  </div>
                  {authError && <div className="p-2 bg-red-100 border border-red-300 text-red-900 text-xs rounded-lg">{authError}</div>}
                  <button type="submit" className="w-full py-2.5 bg-gradient-to-b from-amberAccent-400 to-amberAccent-600 hover:from-amberAccent-500 hover:to-amberAccent-700 text-kraft-950 font-semibold text-xs rounded-xl border border-amberAccent-700/60 tactile-btn transition-colors shadow-sm">
                    {authIsRegister ? 'Sign Up' : 'Sign In'}
                  </button>
                </form>
                <div className="text-center pt-2 border-t border-kraft-border">
                  <button type="button" onClick={() => { setAuthIsRegister(!authIsRegister); setAuthError(''); }} className="text-xs text-amberAccent-700 hover:underline">
                    {authIsRegister ? 'Already have an account? Sign in' : "Don't have an account? Sign up"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
